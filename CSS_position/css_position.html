<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 400px;
        height: 400px;
      }
      .relative {
        background-color: cadetblue;
        position: relative;
      }
      .absolute {
        background-color: chocolate;
        position: absolute;
        top: 50px;
        left: 50px;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute"></div>
    </div>
  </body>
</html>
