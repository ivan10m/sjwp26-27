<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
        box-sizing: border-box; /*koristimo kad želimo zadržati veličinu orginalnu*/
      }
      .prvi {
        background-color: burlywood;
        border: 3px solid black;
        padding: 50px 65px; /*gore i dole, lijevo  i desno*/
        margin: 0 auto;
      }
      .drugi {
        background-color: brown;
        margin: 50px 10px 5px 2px; /*gore desno dolje lijevo*/
        border: 2px solid blue;
        border-radius: 50%;
        /*border-top-right-radius: ;*/
      }
    </style>
  </head>
  <body>
    <div class="prvi">
      <p>Ovo je prvi paragraf u prvom div elementu.</p>
    </div>
    <div class="drugi"></div>
  </body>
</html>
