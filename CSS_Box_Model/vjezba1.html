<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
        box-sizing: border-box; /*da zadržite 300x300px*/
      }
      .prvi {
        background-color: blueviolet;
        border: 2px solid black;
        padding: 50px 60px; /* prva vrijednost - gore i dole, druga vrijed. - lijevo i desno*/
        margin: 0 auto;
      }
      .drugi {
        background-color: cadetblue;
        margin: 20px 10px 5px 2px;
        border-radius: 50%;
        border: 3px solid blue;
      }
    </style>
  </head>
  <body>
    <div class="prvi">
      <p>Ovo je prvi paragraf u prvom div elementu</p>
    </div>
    <div class="drugi"></div>
  </body>
</html>
