<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablice vježba</title>
  </head>
  <body>
    <h1>Tablice</h1>
    <table border="1" style="border-collapse: collapse">
      <tr>
        <th>Tvrtka</th>
        <th>Kontakt</th>
        <th>Zemlja</th>
      </tr>
      <tr>
        <td>Microsoft</td>
        <td>Jozo Bošnjak</td>
        <td>Hrvatska</td>
      </tr>
      <tr>
        <td>Jerko trans doo</td>
        <td>Mislav Jerković</td>
        <td>Austrija</td>
      </tr>
    </table>
    <h2>Spajanje stupaca</h2>
    <table border="1">
      <tr>
        <th colspan="2">Ime i prezime</th>
        <th>Godine</th>
      </tr>
      <tr>
        <td>Ivo</td>
        <td>Ivić</td>
        <td>17</td>
      </tr>
      <tr>
        <td>Jozo</td>
        <td>Nikić</td>
        <td>16</td>
      </tr>
    </table>
    <h2>Spajanje redaka</h2>
    <table border="1" style="width: 600px">
      <tr>
        <th style="font-size: 35px; width: 500px">Ime</th>
        <td>Josip</td>
      </tr>
      <tr>
        <th rowspan="2">Mobitel</th>
        <td style="text-align: center">555-5689</td>
      </tr>
      <tr>
        <td>555-1123</td>
      </tr>
    </table>
  </body>
</html>
